[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench"
version = "0.1.0"
description = "实验工作台：自动抓实验现场（代码 / 命令 / 环境 / 产物），说'记录'时由 agent 认领到 论文 → claim → 配置组"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
panel = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]

[project.scripts]
wb = "workbench.cli:main"

[tool.setuptools]
packages = ["workbench"]
